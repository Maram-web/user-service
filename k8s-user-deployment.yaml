apiVersion: v1
kind: Namespace
metadata:
  name: user
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: marammanai/user-service:latest
          ports:
            - containerPort: 8089
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: user
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - port: 8089
      targetPort: 8089
      nodePort: 30022

#      nodePort: 30091     # Port accessible depuis l’extérieur (VM, navigateur)
