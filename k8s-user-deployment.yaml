apiVersion: v1
kind: Namespace
metadata:
  name: user
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: __IMAGE__  # remplacé par Jenkins
          ports:
            - containerPort: 8089
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/ceph_user_service?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: EUREKA_URL
              value: http://localhost:8761/eureka/
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: user
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - port: 8089
      targetPort: 8089
      nodePort: 30022
