# --- Service "metrics" SANS toucher à ton NodePort existant ---
apiVersion: v1
kind: Service
metadata:
  name: user-service-metrics
  namespace: user
  labels:
    app: user-service
    metrics: "true"
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http              # ⚠️ nom de port requis par le ServiceMonitor
      port: 8089              # même port que ton container
      targetPort: 8089

---
# --- ServiceMonitor pour Prometheus Operator ---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service
  namespace: monitoring
  # ⚠️ Selon l’installation, Prometheus peut filtrer par un label "release".
  # Si tes ServiceMonitors existants ont un label release, ajoute-le ici.
  # labels:
  #   release: prometheus-operator-kube-p
spec:
  selector:
    matchLabels:
      app: user-service        # matche le label du Service ci-dessus
      metrics: "true"
  namespaceSelector:
    matchNames: ["user"]       # namespace où tourne le Service
  endpoints:
    - port: http               # doit matcher "name: http" du Service
      path: /actuator/prometheus
      interval: 30s
